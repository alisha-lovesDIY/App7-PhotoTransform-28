  Brief Description of Goal of Code:

The script will loop through the RGBA pixel data which isolates blue color by setting red and green intesity value to zero. 
This result in blue filtered image which will be displayed on a second canvas for comparison.
Known Issues:
brief delay in processing high- resolution images

<head>
  <meta charset="utf-8" />
  <title>Photo Transform</title>

  <script>
    var docMod = document.lastModified; /* Tracks when file gets last modified date and time of the index.html file */
    console.log("This file last modified: " + docMod); 
    /* displays last modified date and time in the javascipt browser console */

    /* detectVerticalSquash & drawImageIOSFix = are functions that are critical due to a flaw in the iPhone camera software that squishes any photos displayed on an HTML5 canvas element. https://github.com/stomita/ios-imagefile-megapixel
    */
    function detectVerticalSquash(img) {
      var iw = img.naturalWidth,
        ih = img.naturalHeight;
      var canvas = document.createElement("canvas");
      canvas.width = 1;
      canvas.height = ih;
      var ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0);
      var data = ctx.getImageData(0, 0, 1, ih).data;
      var sy = 0;
      var ey = ih;
      var py = ih;
      while (py > sy) {
        var alpha = data[(py - 1) * 4 + 3];
        if (alpha === 0) {
          ey = py;
        } else {
          sy = py;
        }
        py = (ey + sy) >> 1;
      }
      var ratio = py / ih;
      return ratio === 0 ? 1 : ratio;
    }
/* ensure the image looks correct on iPhones. */
    function drawImageIOSFix(ctx, img, sx, sy, sw, sh, dx, dy, dw, dh) {
      var vertSquashRatio = detectVerticalSquash(img);
      ctx.drawImage(img, sx, sy, sw, sh, dx, dy, dw, dh / vertSquashRatio);
    }

    /* window.onload necessary to keep javascripts from running before the app gets a chance to load entirely. */
    window.onload = function () {
      console.log("Page loaded");
      /* This logs a message once the window has finished loading */
      var fileInput = document.getElementById("fileInput");  
      /* Gets the HTML input element for the photo */
      var messageDisplayArea = document.getElementById("messageDisplayArea");
      /* Reference to the area where status messages are shown */
      var canvas = document.getElementById("myCanvas"); 
      /* Gets the first canvas element for the original image */
      var context = canvas.getContext("2d"); 
      /* This creates the 2D rendering context for the first canvas */

      var canvas2 = document.getElementById("dataCanvas");
      /* Gets the second canvas element for the processed (blue) image */
      var context2 = canvas2.getContext("2d"); 
      /* Creates the 2D rendering context for the second canvas */

      context.font = "20pt Calibri"; 
      /* Sets the font style for the first canvas placeholder */
      context.fillText("Original image will go here", 10, 20); 
      /* Draws the placeholder text at coordinates (10, 20) */

      context2.font = "20pt Calibri";
      /* Sets the font style for the second (blue) canvas placeholder */
      context2.fillText("Blue image will go here", 10, 20); 
      /* Draws the blue image placeholder text */

      /* fileInput.addEventListener looks for any change in the <input> tag indicating that the user has selected a file (picture). */
      fileInput.addEventListener("change", function (e) {
        var file = fileInput.files[0];
        /* Accesses the first file from the user's selection */
        var imageType = /image.*/; 
        /* Defines a regular expression to check if the file is an image */

        /* Checks if the file object is empty */
        if (!file) { 
          messageDisplayArea.innerHTML = "No file selected";
          return; 
          /* Tells the user nothing was uploaded */
        }

        /* Check file type */
        /* Checks if the file is actually an image (jpg, png, etc.) */
        if (!file.type.match("image.*")) { 
          messageDisplayArea.innerHTML = "File not supported!";
          return; /* Alerts the user if they picked a wrong file type */
        }

        messageDisplayArea.innerHTML = "You picked an image!"; 
        /* Updates the UI to confirm successful selection */

        var reader = new FileReader();
        /* Creates a new object to read the file's data */
        reader.onload = function (e) { 
          /* Defines what happens once the file is finished being read */
          var img = new Image(); 
          /* Creates a new image object in memory */
          img.onload = function () {
            /*  Defines what happens once the image object is fully loaded with data */
            
            /* Custom function to draw the image while fixing orientation issues on iOS devices */
            drawImageIOSFix( 
              context,
              img,
              0,
              0,
              img.naturalWidth,
              img.naturalHeight,
              0,
              0,
              600,
              500
            );

            /*  +++++++++++++++ BEGIN IMAGE PROCESSING +++++++++++++++ */
    var imageData = context.getImageData(0, 0, 600, 500);
            /* Grabs the pixel data from the first canvas */

    var data = imageData.data;           
            /* Accesses the underlying array of pixel colors */

    for (var i = 0; i < data.length; i += 4) { 
          /*  Loops through every pixel (RGBA) */'
            
    var blue = data[i + 2];
          /* Extracts the blue value (3rd item in the pixel group) */
      
    data[i] = 0;
        /* Sets Red to zero */
      
    data[i + 1] = 0;
        /* Sets Green to zero */
      
    data[i + 2] = blue; 
        /* Keeps the Blue value exactly as it was */
        }
            
    context2.putImageData(imageData, 0, 0);
    console.log("Blue filter applied successfully");
        } // end of img.onload
          
    img.src = reader.result;
        } // end of reader onload
        
    reader.readAsDataURL(file);
        } // this is the end of the if statement checking that the file is an image
      else        
     {
        // this is what happens if the original file is not an image file
        messageDiplayArea.innerhTML = "File not supported."
      } // end of the else statement if the file is NOT an image
    }); // end of the fileInput.addEventListener function
    } // end of the window.onload function
  </script>

        <input
          type="file"

      </div>
      <div id="messageDisplayArea"></div>
      
      <!-- First canvas image will go here -->
      <canvas
        id="myCanvas"
        width="600"
        height="500"
        style="border:1px solid #d3d3d3"
      ></canvas
         </script> /* This script initates the canvas and puts the text on the canvas "MyCanvas" */
      <!-- Second canvas image will go here -->
      <canvas
        id="dataCanvas"
        width="600"
        height="500"
        style="border:1px solid #d3d3d3"
      ></canvas>
  </script>
